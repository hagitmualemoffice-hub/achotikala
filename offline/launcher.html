<html lang="he" dir="rtl">

<style>

  <div id="ak-pct"></div>
  <div id="ak-err"></div>
  <div id="ak-ver"></div>
</div></div>
<div id="ak-toast"></div>

<script>
/* ================================================================
   אחותי כלה — קובץ הפתיחה הקבוע (bootstrap)
   מוריד את האתר פעם אחת, שומר אותו במחשב, ומעדכן רק מה שהשתנה.
   ================================================================ */
(function () {
  "use strict";

  var qs = new URLSearchParams(location.search);
  // rev 14: רשימת מקורות — הריפו הייעודי קודם, הישן כגיבוי. מניפסט יכול להפנות למקור חדש
  // (שדה origin), שנשמר ב-META ונוסה ראשון מאז — מעבר עתידי ללא התקנה מחדש.
  var ORIGINS = qs.get("origin") ? [qs.get("origin")] : __UPDATE_ORIGINS__;
  var ORIGIN = ORIGINS[0];
  var DB_NAME = "achotikala-app";
  var BOOT_REV = 14;           // גרסת קובץ הפתיחה
  window.AK_BOOT_REV = BOOT_REV; // האפליקציה מתייגת בו ניסיונות התחברות (offline-rev14)
  var MIN_STAGE = "full";     // התקנות ישנות ללא תמונות — יעודכנו מיד
  var BLOBS = "blobs";
  var META = "meta";

  var boxEl = document.getElementById("ak-boot");
  var msgEl = document.getElementById("ak-msg");
  var barEl = document.querySelector("#ak-bar i");
  var pctEl = document.getElementById("ak-pct");
  var errEl = document.getElementById("ak-err");
  var toastEl = document.getElementById("ak-toast");
  var verEl = document.getElementById("ak-ver");
  // שורת גרסאות קבועה על המסך: גרסת קובץ ההפעלה + גרסת החבילה המקומית + זו שבשרת.
  var verInfo = { local: null, remote: null };
  function showVer() {
    if (!verEl) return;
    verEl.textContent =
      "launcher rev " + BOOT_REV +
      " | package " + (verInfo.local == null ? "—" : "v" + verInfo.local) +
      " | server " + (verInfo.remote == null ? "—" : "v" + verInfo.remote);
  }
  function setVer(which, v) { verInfo[which] = v; showVer(); }
  showVer();
  var updateState = window.ACHOTIKALA_UPDATE_STATUS = {
    localVersion: null,
    remoteVersion: null,
    lastCheck: null,
    source: "NOT CHECKED",
    result: "Update check has not run yet",
    error: ""
  };

  function say(t) { msgEl.textContent = t; }
  function progress(done, total) {
    var p = total ? Math.round((done / total) * 100) : 0;
    barEl.style.width = p + "%";
    pctEl.textContent = total ? p + "%" : "";
  }
  function fail(html) {
    errEl.style.display = "block";
    errEl.innerHTML = html;
  }
  function toast(text, actionText, action) {
    toastEl.textContent = text;
    if (actionText) {
      var b = document.createElement("button");
      b.textContent = actionText;
      b.onclick = action;
      toastEl.appendChild(b);
    }
    toastEl.style.display = "block";
  }

  /* ---------------- יומן עדכון מתמיד (שורד רענון וגיבוי לאחור) ----------------
     נשמר ב-meta.updateLog. אין בו שום מידע אישי — רק שלבים, גרסאות ושגיאות. */

  var updateLog = { rev: null, entries: [] };
  function logAdd(step, info) {
    var e = { t: Date.now(), s: step };
    if (info !== undefined && info !== null && info !== "") e.d = info;
    updateLog.entries.push(e);
    if (updateLog.entries.length > LOG_MAX) updateLog.entries.splice(0, updateLog.entries.length - LOG_MAX);
    updateLog.rev = BOOT_REV;
    persistLog();
    return e;
  }
  function errInfo(e) {
    if (!e) return "unknown";
    var name = (e.name || "Error");
    var msg = (e.message || String(e));
    var extra = "";
    try { if (e.detail) extra = " | " + JSON.stringify(e.detail); } catch (x) {}
    return name + ": " + msg + extra;
  }
  var logSaving = false, logDirty = false;
  function persistLog() {
    if (!db) return;
    if (logSaving) { logDirty = true; return; }
    logSaving = true;
    put(db, META, "updateLog", JSON.parse(JSON.stringify(updateLog)))
      .catch(function () {})
      .then(function () {
        logSaving = false;
        if (logDirty) { logDirty = false; persistLog(); }
      });
  }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function logText() {
    return "bootstrap rev: " + BOOT_REV + "\n" +
      updateLog.entries.map(function (e) {
        var d = new Date(e.t);
        return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) + " " +
          two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds()) +
          "  " + e.s + (e.d ? "  " + e.d : "");
      }).join("\n");
  }

  /* ---------------- IndexedDB ---------------- */
  function openDb() {
    return new Promise(function (res, rej) {
      var settled = false;
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () {
        var d = r.result;
        if (!d.objectStoreNames.contains(BLOBS)) d.createObjectStore(BLOBS);
        if (!d.objectStoreNames.contains(META)) d.createObjectStore(META);
      };
      r.onsuccess = function () { if (!settled) { settled = true; res(r.result); } };
      r.onerror = function () { if (!settled) { settled = true; rej(r.error || new Error("idb-open-error")); } };
      r.onblocked = function () {
        if (settled) return;
        settled = true;
        var e = new Error("idb-open-blocked (another copy of the app is probably open)");
        e.name = "BlockedError";
        rej(e);
      };
    });

  function tx(db, store, mode, fn) {
    return new Promise(function (res, rej) {
      var t;
      try { t = db.transaction(store, mode); }
      catch (e) { rej(e); return; }
      var out;
      try { out = fn(t.objectStore(store)); }
      catch (e2) { try { t.abort(); } catch (e3) {} rej(e2); return; }
      if (out && typeof IDBRequest !== "undefined" && out instanceof IDBRequest) {
        out.onerror = function () { /* מטופל ב-onerror/onabort של הטרנזקציה */ };
      }
      t.oncomplete = function () { res(out && typeof IDBRequest !== "undefined" && out instanceof IDBRequest ? out.result : out); };
      t.onerror = function () { rej(t.error || new Error("idb-tx-error")); };
      // ללא onabort טרנזקציה שנקטעה (למשל QuotaExceededError) הייתה משאירה
      // את ההבטחה תלויה לנצח — והעדכון היה נתקע בלי שום שגיאה גלויה.
      t.onabort = function () {
        var err = t.error || new Error("idb-tx-aborted");
        if (!err.name) err.name = "AbortError";
        rej(err);
      };
    });
  }
  function isQuotaError(e) {
    if (!e) return false;
    var n = String(e.name || ""), m = String(e.message || "");
    return n === "QuotaExceededError" || /quota|storage is full|not enough space/i.test(n + " " + m);
  }
  function get(db, store, key) { return tx(db, store, "readonly", function (s) { return s.get(key); }); }
  function put(db, store, key, val) { return tx(db, store, "readwrite", function (s) { return s.put(val, key); }); }
  function del(db, store, key) { return tx(db, store, "readwrite", function (s) { return s.delete(key); }); }
  function keys(db, store) { return tx(db, store, "readonly", function (s) { return s.getAllKeys(); }); }
  function switchManifest(db, current, remote) {
    return new Promise(function (res, rej) {
      var t = db.transaction(META, "readwrite");
      var s = t.objectStore(META);
      s.put(current, "previous");
      s.put(remote, "current");
      s.put({ version: remote.version, attempts: 0, verified: false }, "boot");
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
      t.onabort = function () { rej(t.error || new Error("manifest-switch-aborted")); };
    });
  }

  /* ---------------- checksum (crypto.subtle לא זמין ב-file://) ---------------- */
  function djb2(buf) {
    var v = new Uint8Array(buf), h = 5381;
    for (var i = 0; i < v.length; i++) h = ((h * 33) ^ v[i]) >>> 0;
    return h.toString(16);
  }

  /* ---------------- הבאת המניפסט דרך תג script (הערוץ המוכח) ---------------- */
  function validOrigin(o) {
    return typeof o === "string" && /^https:\/\/[^\s"'<>]+$/.test(o) ? o.replace(/\/$/, "") : null;
  }
  function preferOrigin(o) {
    o = validOrigin(o);
    if (!o) return;
    ORIGINS = [o].concat(ORIGINS.filter(function (x) { return x !== o; }));
  }
  // מנסה כל מקור בתורו; החלקים נטענים מהמקור שממנו הגיע המניפסט.
  function loadManifest(timeoutMs) {
    var list = ORIGINS.slice(), i = 0, errs = [];
    function next() {
      if (i >= list.length) {
        var e = new Error(errs[errs.length - 1] || "manifest-blocked");
        e.message = errs.join(" | ") || "manifest-blocked";

        ORIGIN = o;
        logAdd("origin", "manifest from " + o + (i > 1 ? " (fallback #" + i + ")" : ""));
        var redirect = validOrigin(m && m.origin);
        if (redirect && redirect !== o && db) {

          put(db, META, "originOverride", redirect).catch(function () {});

        errs.push((e && e.message || "error") + "@" + o);

        return next();
      });
    }
    return next();
  }
  function loadManifestFrom(ORIGIN, timeoutMs) {
    return new Promise(function (res, rej) {
      var done = false;
      var s = document.createElement("script");
      var callback = function (m) {
        if (done) return;
        done = true;
        updateState.remoteVersion = m && m.version != null ? m.version : null;
        setVer("remote", updateState.remoteVersion);
        updateState.source = "NETWORK (cache-busted script)";
        cleanup();
        res(m);
      };
      window.AKUPD_MANIFEST = callback;
      function cleanup() {
        if (window.AKUPD_MANIFEST === callback) delete window.AKUPD_MANIFEST;
        try { s.remove(); } catch (e) {}
      }
      s.onerror = function () { if (!done) { cleanup(); rej(new Error("manifest-blocked")); } };
      // A unique URL forces a network request. A file:// app has no Service Worker
      // controller, and the update manifest is never read from IndexedDB/Cache Storage.
      s.src = ORIGIN + "/updates/manifest.js?t=" + Date.now() + "&nonce=" +
        Math.random().toString(36).slice(2);
      s.setAttribute("data-cache", "no-store");
      document.head.appendChild(s);
      setTimeout(function () {
        if (!done) { done = true; cleanup(); rej(new Error("manifest-timeout")); }
      }, Math.min(timeoutMs || 15000, 15000));
    });
  }

  /* ---------------- ערוץ ההעברה: קבצי .js אמיתיים בתג script ---------------- */
  var AK = window.AK = window.AK || {};
  var partSink = null;            // תאימות לאחור
  var partSinks = Object.create(null); // hash -> { index: b64 } (מאפשר הורדה מקבילה)
  AK.part = function (hash, index, total, b64, masked) {
    var sink = partSinks[hash];
    if (sink) sink[index] = { b64: b64, masked: masked };
    if (partSink && partSink.hash === hash) partSink.receive(index, total, b64, masked);
  };
  /* ---- seed: חלקים מוטמעים בתוך קובץ ההתקנה עצמו (התקנה ראשונה בלי רשת) ---- */
  var seedStore = Object.create(null); // hash -> { index: b64 }
  AK.seedPart = function (hash, index, total, b64) {
    if (!seedStore[hash]) seedStore[hash] = Object.create(null);
    seedStore[hash][index] = b64;
  };
  AK.seedDone = function () {
    window.AK_SEED_PENDING = 0;
    if (typeof AK.seedReady === "function") { var f = AK.seedReady; AK.seedReady = null; f(); }
  };
  var XOR_KEY = [0x5a, 0x3c, 0xa7, 0x11, 0x6d, 0xf2, 0x89, 0x24];
  function b64ToBytes(b64, masked) {
    var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
    for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
    if (masked) for (var j = 0; j < len; j++) out[j] ^= XOR_KEY[j % 8];
    return out;
  }
  function loadPartScript(url, hash, index) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      var settled = false;
      function finish(fn, arg) { if (settled) return; settled = true; try { s.remove(); } catch (e) {} fn(arg); }
      s.src = url;
      s.onload = function () { finish(res); };
      s.onerror = function () {
        var e = new Error("part-blocked");
        e.detail = { stage: "טעינת חלק JS", url: url, file: hash, index: index };
        finish(rej, e);
      };
      document.head.appendChild(s);
      setTimeout(function () {
        var e = new Error("part-timeout");
        e.detail = { stage: "טעינת חלק JS (פסק זמן)", url: url, file: hash, index: index };
        finish(rej, e);
      }, 45000);
    });
  }

  /** מוריד חלק בודד, מאמת אותו, ומנסה שוב עד 4 פעמים אם הוא הגיע חסר */
  function downloadChunk(f, meta, i, total, attempt) {
    attempt = attempt || 1;
    var received = null;
    if (!partSinks[f.h]) partSinks[f.h] = Object.create(null);
    var url = ORIGIN + meta.u + (attempt > 1 ? "?r=" + attempt + "." + Date.now() : "");
    // חלק שהגיע מוטמע בקובץ ההתקנה — אותו פורמט ואותו אימות, בלי בקשת רשת.
    // בניסיון חוזר עוברים לרשת, כדי שחלק פגום בקובץ לא ייתקע בלופ.
    var seeded = attempt === 1 && seedStore[f.h] ? seedStore[f.h][i] : null;
    var fetchPart = seeded
      ? Promise.resolve().then(function () { AK.part(f.h, i, total, seeded, 0); })
      : loadPartScript(url, f.p, i);
    return fetchPart.then(function () {
      var slot = partSinks[f.h] && partSinks[f.h][i];
      if (slot) { received = b64ToBytes(slot.b64, slot.masked); delete partSinks[f.h][i]; }
      var bad = null;
      if (!received) bad = "חלק לא התקבל";
      else if (meta.l != null && received.length !== meta.l) bad = "חלק קטוע";
      else if (meta.c != null && djb2(received.buffer.slice(received.byteOffset, received.byteOffset + received.length)) !== meta.c) bad = "חלק פגום";
      if (bad) {
        var e = new Error(bad);
        e.detail = {
          stage: "אימות חלק", url: url, file: f.p, index: i + 1, of: total,
          expectedBytes: meta.l, gotBytes: received ? received.length : 0, attempt: attempt,
        };
        throw e;
      }
      return received;
    }).catch(function (e) {
      if (partSinks[f.h]) delete partSinks[f.h][i];
      if (attempt < 4) {
        return new Promise(function (r) { setTimeout(r, 400 * attempt); })
          .then(function () { return downloadChunk(f, meta, i, total, attempt + 1); });
      }
      throw e;
    });
  }

  /** מוריד קובץ שלם דרך חלקי ה-JS שלו ומחזיר ArrayBuffer מאומת */
  function downloadFile(f, onChunk) {
    var metas = f.k && f.k.length
      ? f.k
      : (f.j || []).map(function (u) { return { u: u }; });
    if (!metas.length) return Promise.reject(new Error("no-js-parts"));
    var chunks = new Array(metas.length);
    // הורדה מקבילה מוגבלת — כל חלק עדיין מאומת בנפרד (אורך + checksum)
    var CONCURRENCY = 4;
    var nextIdx = 0, firstErr = null;
    function worker() {
      if (firstErr || nextIdx >= metas.length) return Promise.resolve();
      var i = nextIdx++;
      return downloadChunk(f, metas[i], i, metas.length).then(function (bytes) {
        chunks[i] = bytes; // חלק שאומת נשמר — כישלון בחלק אחר לא מבטל אותו
        if (onChunk) onChunk(bytes.length);
        return worker();
      }).catch(function (e) { if (!firstErr) firstErr = e; });
    }
    var lanes = [];
    for (var w = 0; w < Math.min(CONCURRENCY, metas.length); w++) lanes.push(worker());
    return Promise.all(lanes).then(function () {
      if (firstErr) throw firstErr;
      delete partSinks[f.h];
      var total = 0, i;
      for (i = 0; i < chunks.length; i++) total += chunks[i].length;
      var out = new Uint8Array(total), off = 0;
      for (i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
      // f.x = מספר הבתים בתחילת הקובץ ששובשו באריזה (חתימת קובץ בינארי, למשל JPEG),
      // כדי שמסנני תוכן לא יזהו "magic bytes" בתחילת החלק הראשון. משוחזרים כאן, פעם אחת,
      // על הקובץ המלא — לפני אימות האורך/החתימה (שמחושבים על התוכן המקורי).
      if (f.x) for (i = 0; i < f.x && i < out.length; i++) out[i] ^= 0x5a;
      var buf = out.buffer;

        throw e2;

      return buf;
    }).catch(function (e) { delete partSinks[f.h]; throw e; });

  /* ---------------- הורדת קבצים חסרים ---------------- */
  function downloadMissing(db, manifest, onProgress) {
    return keys(db, BLOBS).then(function (have) {
      var haveSet = new Set(have);
      var seen = new Set();
      var need = manifest.files.filter(function (f) {
        if (haveSet.has(f.h) || seen.has(f.h)) return false;
        seen.add(f.h); return true;
      });
      var totalBytes = need.reduce(function (a, f) { return a + f.s; }, 0);
      var doneBytes = 0, idx = 0, failed = null, doneFiles = 0;
      logAdd("download-start", "files needed: " + need.length + ", bytes: " + totalBytes);
      if (!need.length) { logAdd("download-done", "0 files needed (all hashes already stored)"); return { need: 0 }; }

      function next() {
        if (failed || idx >= need.length) return Promise.resolve();
        var f = need[idx++];
        var fileDone = 0;
        return downloadFile(f, function (n) {
          fileDone += n;
          if (onProgress) onProgress(Math.min(doneBytes + fileDone, totalBytes), totalBytes);
        })
          .then(function (buf) {
            logAdd("validated", f.p + " (" + buf.byteLength + " bytes)");
            logAdd("store-start", f.p);
            return put(db, BLOBS, f.h, buf);
          })
          .then(function () {
            doneFiles++;
            doneBytes += f.s;
            logAdd("store-ok", f.p + " [" + doneFiles + "/" + need.length + "]");
            if (onProgress) onProgress(doneBytes, totalBytes);
            return next();
          })
          .catch(function (e) {
            if (isQuotaError(e)) {
              e.quota = true;
              logAdd("QUOTA-EXCEEDED", "no room to store " + f.p + " — " + errInfo(e));
            } else {
              logAdd("file-failed", f.p + " — " + errInfo(e));
            }
            if (!e.detail) e.detail = { stage: "הורדת קובץ מהאתר", file: f.p, expectedBytes: f.s, error: String(e && e.message || e) };
            failed = e;

  function installResolver(app) {
    var byName = {}, byPath = {};
    Object.keys(app.urlMap).forEach(function (p) {

    });

    var hits = 0;

    function resolve(v) {
      if (!v || typeof v !== "string") return v;
      if (/^(blob:|data:)/i.test(v)) return v;
      var clean = v.split("?")[0].split("#")[0].replace(/^https?:\/\/[^/]+/i, "");
      var rel = clean.replace(/^\.?\//, "");

  function mount(app, version) {

    document.documentElement.setAttribute("dir", doc.documentElement.getAttribute("dir") || "rtl");
    var t = doc.querySelector("title");
    if (t) document.title = t.textContent;

    window.ACHOTIKALA_OFFLINE_HOST = true;
    window.ACHOTIKALA_OFFLINE = true;
    window.ACHOTIKALA_APP_VERSION = version;

    Array.prototype.forEach.call(doc.head.children, function (el) {
      var tag = el.tagName.toLowerCase();
      if (tag === "title" || tag === "script") return;

        if (!app.urlMap[origPath]) return runNext(i + 1);

        rows =
          "<div style='text-align:start;direction:ltr;background:#faf6f8;border-radius:10px;padding:12px;margin-top:12px;font-size:12px;word-break:break-all'>" +
          "<div><b>stage:</b> " + (d.stage || "") + "</div>" +
          "<div><b>url:</b> " + (d.url || "") + "</div>" +
          "<div><b>file:</b> " + (d.file || "") + "</div>" +
          "<div><b>status:</b> " + (d.status !== undefined ? d.status : "(no response)") + "</div>" +
          "<div><b>content-type:</b> " + (d.contentType || "") + "</div>" +
          "<div><b>expected bytes:</b> " + (d.expectedBytes !== undefined ? d.expectedBytes : "") + "</div>" +
          (d.gotBytes !== undefined ? "<div><b>got bytes:</b> " + d.gotBytes + "</div>" : "") +
          (d.contentLength ? "<div><b>content-length:</b> " + d.contentLength + "</div>" : "") +
          (d.error ? "<div><b>error:</b> " + d.error + "</div>" : "") +
          "</div>";
      } else {
        rows = "<div style='margin-top:10px;font-size:13px'>שלב: טעינת רשימת העדכונים (manifest.js) — " +
          ORIGIN + "/updates/manifest.js</div>";
      }
      fail("לא הצלחנו להוריד את האתר כרגע (" + (e.message || e) + ")." + rows +
        "<div style='margin-top:10px'>צלמי את המסך הזה ושלחי אותו.</div>");
    });
  }

  function start(manifest, previous) {
    updateState.localVersion = manifest.version;
    setVer("local", manifest.version);
    logAdd("render", "version " + manifest.version + " — " + activeContent(manifest));
    return buildApp(db, manifest).then(function (app) {
      return mount(app, manifest.version).then(function () { installDiagnostics(manifest, app); });
    }).then(function () {
      // הגרסה נחשבת תקינה ברגע שהאפליקציה עלתה — אחרת סגירה מהירה פעמיים
      // אחרי עדכון הייתה מחזירה אוטומטית לגרסה הקודמת (59) ומבטלת את ההתקנה.
      logAdd("health-ok", "version " + manifest.version + " opened successfully");
      put(db, META, "boot", { version: manifest.version, attempts: 0, verified: true })
        .catch(function (e) { logAdd("health-write-failed", errInfo(e)); });
      setTimeout(function () { checkForUpdate(manifest, previous); }, 600);
    }).catch(function (e) {
      logAdd("render-failed", "version " + manifest.version + " — " + errInfo(e));
      // הגרסה הנוכחית לא ניתנת להרכבה — ניסיון מיידי בגרסה הקודמת
      if (previous) {
        logAdd("ROLLBACK", "could not build version " + manifest.version + " — falling back to " + previous.version);
        return Promise.all([put(db, META, "current", previous), del(db, META, "previous")])
          .then(function () { return start(previous, null); });
      }
      say("לא הצלחנו לפתוח את האתר");
      fail("שגיאה: " + errInfo(e));
    });
  }

  /** פסק זמן כולל — עדכון לא יכול להישאר תלוי בלי שגיאה מתועדת */
  var UPDATE_TIMEOUT_MS = 15 * 60 * 1000;
  function withTimeout(p, ms, label) {
    return new Promise(function (res, rej) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        var e = new Error(label + " timed out after " + Math.round(ms / 1000) + "s");
        e.name = "UpdateTimeoutError";
        rej(e);
      }, ms);
      p.then(function (v) { if (!done) { done = true; clearTimeout(timer); res(v); } },
             function (e) { if (!done) { done = true; clearTimeout(timer); rej(e); } });
    });
  }

  var updateCheckPromise = null;
  function checkForUpdate(current, previous, manual) {
    if (updateCheckPromise) return updateCheckPromise;
    // התקנה ישנה ללא תמונות — מעדכנים מיד, עם התקדמות גלויה, ופותחים מחדש לבד
    var stale = (current.stage || "core") !== MIN_STAGE;
    updateState.localVersion = current.version;
    setVer("local", current.version);
    updateState.remoteVersion = null;
    updateState.lastCheck = Date.now();
    updateState.source = "NETWORK REQUEST IN PROGRESS";
    updateState.result = "Checking for update…";
    updateState.error = "";
    logAdd("check-start", "local " + current.version + (manual ? " (manual)" : "") + (stale ? " [stale stage]" : ""));
    var flow = loadManifest(20000).then(function (remote) {
      if (!remote || remote.version == null) throw new Error("invalid-remote-manifest");
      updateState.remoteVersion = remote.version;
      logAdd("remote-version", String(remote.version) + " (NETWORK, cache-busted script)");
      if (Number(remote.version) <= Number(current.version) && !stale) {
        updateState.result = "Already current";
        logAdd("already-current", "local " + current.version + " >= remote " + remote.version);
        if (manual) toast("הגרסה במחשב מעודכנת");
        return;
      }
      updateState.result = "Update " + current.version + " → " + remote.version + " found";
      logAdd("update-detected", current.version + " -> " + remote.version + ", files in remote package: " + remote.files.length);
      if (stale) toast("מורידה את התמונות של האתר… 0%");
      // ניקוי מקדים: משחרר blobs יתומים מגרסאות ישנות לפני שממלאים אחסון
      return gc(db, [current, previous, remote]).then(function (freed) {
        logAdd("pre-download-gc", "orphan blobs removed: " + (freed && freed.length ? freed.length : 0));
      }).catch(function (e) {
        logAdd("pre-download-gc-failed", errInfo(e)); // לא חוסם את העדכון
      }).then(function () {
        return downloadMissing(db, remote, function (d, t) {
          if (stale && t) toast("מורידה את התמונות של האתר… " + Math.round((d / t) * 100) + "%");
        });
      }).then(function () {
        // This runs even when every remote file hash is already present locally.
        // The active manifest version is switched in one IndexedDB transaction.
        logAdd("activation-start", "active before: " + current.version + " (" + activeContent(current) + ")");
        return switchManifest(db, current, remote);
      }).then(function () {
        logAdd("activation-ok", "active after: " + remote.version + " (" + activeContent(remote) + ")");
        return gc(db, [remote, current]);
      }).then(function () {
        updateState.result = "Updated to version " + remote.version + "; reloading";
        return put(db, META, "bootRev", BOOT_REV);
      }).then(function () {
        logAdd("reload", "restarting into version " + remote.version);
        toast("העדכון הותקן — פותחת מחדש…");
        setTimeout(function () { location.reload(); }, 900);
      });
    });
    updateCheckPromise = withTimeout(flow, UPDATE_TIMEOUT_MS, "update").catch(function (e) {
      var detail = e && (e.detail || e.message || String(e));
      window.ACHOTIKALA_UPDATE_ERROR = detail;
      updateState.source = updateState.remoteVersion == null ? "NETWORK ERROR" : updateState.source;
      if (e && e.quota) {
        updateState.result = "Update failed — no storage space";
        toast("אין מספיק מקום פנוי במחשב להתקנת הגרסה החדשה");
      } else {
        updateState.result = "Update check failed";
      }
      updateState.error = errInfo(e);
      logAdd("UPDATE-FAILED", errInfo(e));
      if (stale) toast("לא הצלחנו להוריד את התמונות כרגע — ננסה שוב בפתיחה הבאה");
      else if (manual && !(e && e.quota)) toast("בדיקת העדכון נכשלה — הפרטים מופיעים באבחון");
    }).then(function () {
      updateCheckPromise = null;
    });
    return updateCheckPromise;
  }
})();
</script>
</body>
</html>
